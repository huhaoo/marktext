name: Release MarkText

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild (for example v0.19.1-0.5)'
        required: true
        type: string
  push:
    # Broad trigger so the validate job can reject malformed v-tags
    # (e.g. `vbad.tag`) instead of them silently not triggering anything.
    tags:
      - 'v*'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MARKTEXT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate version and run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: refs/tags/${{ env.MARKTEXT_RELEASE_TAG }}

      - uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Validate semver tag and package versions
        run: |
          node <<'NODE'
          const { SemVer } = require('semver');
          const tag = process.env.MARKTEXT_RELEASE_TAG;
          if (!tag.startsWith('v')) throw new Error('Expected a v-prefixed SemVer tag');
          if (process.env.GITHUB_REPOSITORY === 'huhaoo/marktext' && !/^v0\.19\.1-0\.(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?$/.test(tag)) {
            throw new Error('This personal maintenance line uses v0.19.1-0.N or v0.19.1-0.N.M. Change the documented baseline explicitly before publishing another series.');
          }
          const version = tag.slice(1);
          new SemVer(version);
          for (const file of ['./package.json', './packages/desktop/package.json']) {
            if (require(file).version !== version) throw new Error(`${file} version does not match ${tag}`);
          }
          console.log(`Validated ${tag}`);
          NODE

      - name: Check portable settings sync paths
        run: pnpm exec tsx scripts/test-settings-sync.mjs

      - run: pnpm test:unit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate-licenses

  build:
    name: Build (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            platform: linux
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            platform: windows
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4.3.1
        with:
          ref: refs/tags/${{ env.MARKTEXT_RELEASE_TAG }}

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      - name: Install Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      # Cache Electron binary; key on package.json so it busts when Electron version changes.
      - name: Cache Electron binary
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      # Must be set before postinstall runs electron-rebuild
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: Generate third-party notices
        run: pnpm gen-third-party

      - name: build-linux
        if: matrix.platform == 'linux'
        run: pnpm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mac builds are unsigned (no Developer ID); see release notes for the
      # user-side xattr/codesign workaround. Per-arch script: electron-builder's
      # --arm64/--x64 flags are additive over the config's arch list, so
      # electron-builder.yml must not pin mac.target arches for the flag to
      # actually restrict the build to a single arch.
      - name: build-mac
        if: matrix.platform == 'macos'
        run: pnpm run build:mac:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build-win
        if: matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: marktext-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Per-job permissions REPLACE workflow-level ones, so re-declare
    # both: contents:write to publish the release, actions:read for
    # download-artifact's Actions API calls.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: refs/tags/${{ env.MARKTEXT_RELEASE_TAG }}
      # upload-artifact@v4 treats `dist/` as the common-ancestor root and
      # stores files flat inside each artifact (no `dist/` prefix). Downloading
      # with `path: dist` + `merge-multiple` recreates `./dist/<file>` across
      # all platforms.
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          # Deterministic ordering so identical inputs always produce identical output
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          echo "---"
          cat SHA256SUMS.txt

      - name: Compose release notes body
        env:
          IS_PRERELEASE: ${{ contains(env.MARKTEXT_RELEASE_TAG, '-') }}
        run: |
          {
            notes="docs/releases/${MARKTEXT_RELEASE_TAG}.md"
            if [[ -f "$notes" ]]; then
              cat "$notes"
              echo ""
            fi
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              echo "## ❗ This is a pre-release"
              echo "- May contain bugs and unfinished features."
              echo ""
            fi
            echo "## ⚠️ Note for macOS users"
            echo "Builds are unsigned (no Apple Developer ID). After dragging MarkText into Applications, clear the quarantine flag once:"
            echo '```'
            echo 'xattr -cr /Applications/marktext.app'
            echo '```'
            echo ""
            echo "## Verifying downloads"
            echo "All artifacts are listed with their SHA-256 in \`SHA256SUMS.txt\`. Verify with:"
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2.6.2
        with:
          # Publish personal-fork releases immediately so the generated
          # Windows installers are visible on the repository Releases page.
          draft: false
          prerelease: ${{ contains(env.MARKTEXT_RELEASE_TAG, '-') }}
          tag_name: ${{ env.MARKTEXT_RELEASE_TAG }}
          generate_release_notes: true
          name: ${{ env.MARKTEXT_RELEASE_TAG }}
          overwrite_files: true
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Withdraw misnumbered personal release
        if: github.repository == 'huhaoo/marktext' && env.MARKTEXT_RELEASE_TAG == 'v0.19.1-0.5'
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: 'v0.20.0-rc.3'
            });
            const notice = '此版本号误标。代码基于 0.19.1 个人维护线，请使用 v0.19.1-0.5。';
            const updated = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.data.id,
              draft: true,
              name: '误标版本（已撤回）：v0.20.0-rc.3',
              body: release.data.body?.startsWith(notice) ? release.data.body : `${notice}\n\n${release.data.body || ''}`
            });
            if (!updated.data.draft) throw new Error('Misnumbered release was not withdrawn');
            core.info('Misnumbered release retained as a draft; its tag and assets were preserved.');
